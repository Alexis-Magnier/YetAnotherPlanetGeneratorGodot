[package]
name = "yapg_gd"
version = "0.1.0"
edition = "2021"

[dependencies]
godot = "0.5.5"
paste = "1.0.15"
tracing = "0.1.44"
slotmap = "1.1.1"
thiserror = "2.0.21"
enum-map = "3.1.0"
downcast-rs = "2.0.2"
glam = "0.34.1"
anyhow = "1.0.104"
bitvec = "1.1.1"
noise = "0.9.0"
rand_distr = "0.6.0"
rand = "0.10.3"
delaunator = "1.1.0"
priority-queue = "2.7.0"

[features]
nothreads = ["godot/experimental-wasm-nothreads"]
editor-docs = ["godot/register-docs"]

[lib]
crate-type = ["cdylib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.editor]
inherits = "release"
