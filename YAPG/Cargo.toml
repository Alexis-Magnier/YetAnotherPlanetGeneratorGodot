[workspace]
members = [
    "godot",
    "YAPG/src/core",
    "YAPG/src/stages",
]
resolver = "2"


[workspace.dependencies]
yapg-core = { path = "YAPG/src/core" }
yapg-stages = { path = "YAPG/src/stages" }

anyhow = "1.0.104"
glam = "0.33.5"
noise = "0.9.0"
rand = "0.10.2"
bitflags = "2.13.1"
inventory = "0.3.24"
enumflags2 = "0.7.12"
tracing = "0.1.44"

[workspace.features]
nothreads = ["godot/experimental-wasm-nothreads"]
editor-docs = ["godot/register-docs"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.editor]
inherits = "release"